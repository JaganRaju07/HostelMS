<!doctype html>
<html lang="en">
<head th:replace="base :: head">
     
</head>
<body>
<th:block th:replace="base :: header">
</th:block> 
<div class="card card-info">
<div class="card-heading">
Visitors
</div>
<div class="card-body">
<div id="print_out">
 <table class="table table-stripped bg-transparent">
 <thead>
            <tr> 
                <th>Vistor</th>
                <th>Vistor Time</th> 
                <th>Flat</th>
                <th>Purpose</th> 
                <th class="nprint">Actions</th>
            </tr>
</thead>
<tbody>
      <tr th:each="s:${vrequests}"> 
                <td th:text="${s.visitor}"></td>
                <td th:text="${s.visitingtime}"></td>
                <td th:text="${s.flat}"></td>
                <td th:text="${s.purpose}"></td> 
                <td  class="nprint"> 
 

                                            <a  class='dialoganchor' href='#' th:data-href="${'/member/removevisitorentry/'+s.id}" onclick="return confirm('Are you sure you want to remove?');"><button class="btn btn-primary">Remove</button> 
                                          </a>
                                           
                                            </td>    
            </tr>
</tbody>
</table>
</div>
<button   class="btn btn-primary btn-lg float-end m-2" title="Complaints" id="print">Print </button> 
<button   class="btn btn-primary btn-lg float-end m-2" data-bs-toggle="modal" data-bs-target="#add_model">Add </button> 

</div> 
</div>

<!---LOGIN PABNEL END-->            
             
  
     <!-- CONTENT-WRAPPER SECTION END-->
	   <th:block   th:replace="base :: footer">
 
   </th:block>
   
   
   
   
   
   <div class="modal fade" id="add_model" data-user_id="0" data-backdrop="static" data-keyboard="false" tabindex="-1" role="dialog" aria-labelledby="user_modal_title" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-notify modal-info" role="document">
    <div class="modal-content">
    
        <form class="ajaxfrm" id="addform"    data-reload=1 data-reset=1 action="/member/addvisitordb" > 
      <div class="modal-header">
        <h5 class="modal-title white-text" id="user_modal_title">Add Visitor</h5>
        <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
          <span aria-hidden="true" class="white-text">&times;</span>
        </button>
      </div>
      <div class="modal-body">

          
          <div class="form-group"> 
                <label for="user_password">Visitor Name</label>
                <input type="text" class="form-control" name="name" required />  
          </div>
          <div class="form-group"> 
                <label for="user_password">Purpose(optional)</label>
                <input type="text" class="form-control" name="purpose" required />   
          </div>
   <div class="form-group">
<label>Flat</label>
 <select class="form-select" name="flat" required>  
                   <option th:each="i : ${flats}" th:value="${i.id}" th:text="${i.name}"></option>
                </select>
                 </div>
                 <div class="form-group"> 
                <label for="user_password">Visiting Time</label>
                <label for="user_password">From</label>
                <input type="datetime-local" class="form-control" name="fromtime" required />   To 
                
                <input type="datetime-local" class="form-control" name="totime" required />   
          </div>
      </div>
      <div class="modal-footer justify-content-start">      
        <div class="col-8">
           <div    class="msg msg-error d-none"> </div>
        
            <div class="msg msg-success d-none"> </div>
        </div>
        <div class="col-3">
          <button type="submit" class="btn btn-success w-100">Save</button>
        </div>
      </div>
    
        </form>
    </div>
  </div>
</div>
  <script>
   $(function() { 
	     $(".dialoganchor").off( "click");
	 	$(".dialoganchor").click(function(e) { 
	 	    e.preventDefault(); // avoid to execute the actual submit of the form.

	 	    var ele = $(this);
	 	    var url = ele.attr('data-href');
	 	     if(!url) return;
	 	    $.ajax({
	 	           type: "POST",
	 	           url: url,  
	 			    dataType: "json",
	 	           success: function(data)
	 	           {
	 			       alert(data.html);
	 	                document.location.reload(); 
	 	           }
	 	         });

	 	}); 
   }); 
   </script>
   
</body>
</html>
