<!doctype html>
<html lang="en">
<head th:replace="base :: head">
     
</head>
<body>
<th:block th:replace="base :: header">
</th:block>    

<div class="card card-info">
<div class="card-heading">
 My Profile
</div>
<div class="card-body">
 
   
                            <form name="signup" id="peditfrm" method="post" action="/member/updateprofile" >

<div class="form-group">
<label>User ID : </label>
#<th:block th:text="${id}"></th:block>
</div>

 
<th:block th:if="${updationtime}">
<div class="form-group">
<label>Last Updation Time : </label>
<th:block th:text="${updationtime}"></th:block>
</div>
</th:block>

 


<div class="form-group">
<label>  Full Name</label>
<input class="form-control" type="text" name="fullname" th:value="${name}" autocomplete="off" required />
</div>
 

<div class="form-group">
<label>Mobile Number :</label>
<input class="form-control" type="text" name="mobileno" maxlength="10" th:value="${mobile}" autocomplete="off" required />
</div>
                                        
<div class="form-group">
<label>  Email</label>
<input class="form-control" type="email" name="username" id="username" th:value="${emailid}"  autocomplete="off" required readonly />
</div> 
                              
<button type="submit" name="update" class="btn btn-primary" id="submit">Update Now </button>

                                    </form>
                                    <div class="mt-3">
                                     <div class="msg msg-success" role="alert"  th:if="${success}" th:text="${success}">  
  </div>
  <div class="msg msg-error" role="alert"  th:if="${error}" th:text="${error}">  
</div>
                                    </div>
                            </div>
                        </div> 
     <!-- CONTENT-WRAPPER SECTION END-->
   <th:block   th:replace="base :: footer">
 
   </th:block> 
   
</body>
</html>
