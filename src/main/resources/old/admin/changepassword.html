<!doctype html>
<html lang="en">
<head th:replace="base :: head">
     
</head>
<body>
<th:block th:replace="base :: header">
</th:block>
<script type="text/javascript">
function valid()
{
if(document.chngpwd.newpassword.value!= document.chngpwd.confirmpassword.value)
{
alert("New Password and Confirm Password Field do not match  !!");
document.chngpwd.confirmpassword.focus();
return false;
}
return true;
}
</script>


   
 
<div class="card card-info">
<div class="card-heading">
Change Password
</div>
<div class="card-body">
<form role="form" method="post" onSubmit="return valid();" name="chngpwd" action="/admin/updatepassword" >

<div class="form-group">
<label>Current Password</label>
<input class="form-control" type="password" name="password" autocomplete="off" required  />
</div>

<div class="form-group">
<label>Enter Password</label>
<input class="form-control" type="password" name="newpassword" autocomplete="off" required  />
</div>

<div class="form-group">
<label>Confirm Password </label>
<input class="form-control"  type="password" name="confirmpassword" autocomplete="off" required  />
</div>

 <button type="submit" name="change" class="btn btn-primary btn-lg float-end">Change </button> 
</form>
  
 </div>
 <div class="container">
<div class="msg msg-error" role="alert" th:if="${updatepassword_errors}" th:text="${updatepassword_errors}"> 
</div> 
 
 
<div class="msg msg-success" role="alert"  th:if="${updatepassword_success}" th:text="${updatepassword_success}">  
</div>
 </div>
</div> 
<!---LOGIN PABNEL END-->            
             
  
     <!-- CONTENT-WRAPPER SECTION END-->
	   <th:block   th:replace="base :: footer">
 
   </th:block>
</body>
</html>
