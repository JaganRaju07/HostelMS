<!doctype html>

<html lang="en">

<head th:replace="admin/base :: head">
     
</head>

<body>
   <th:room  th:replace="admin/base :: header">
   </th:room>
            <div class="content">
                <div class="container">
                    <div class="row">
                        <div class="col-md-12 page-header"> 
                            <h2 class="page-title">Rooms Allocation</h2>
       <input th:if="${block}" type="hidden" id="block"  th:value="${block.id}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="  col-md-10 m-auto   mt-3">
                            <div class="card">
                            <div class="card-body"> 
 
 <table id="listtab" class="table table-striped table-hover table-bordered " cellspacing="0" width="100%">

                <thead>
                    <tr>
                        <th>RoomNo</th>  
                        <th>Block</th>
                        <th>Floor</th>
                        <th>Max Allocations</th>
                        <th>Current Allocations</th>
                        <th>Actions</th>
                    </tr>
                </thead>
              
                <tbody>
                    
</tbody>
</table>
</div>
</div>

</div> 
</div>
</div>
</div> 
             
  
     <!-- CONTENT-WRAPPER SECTION END-->
	   <th:room   th:replace="admin/base :: footer">
 
   </th:room>
   
   
     <script> 
     var dtable;
    $( function() {
  	  
  	   loaddata();
    });
    
    function loaddata()
    { 
    	 if(dtable!=null) $('#listtab').DataTable().clear().destroy();
    	 
    		  data={action:"readall"} ; 
        $.ajax({
               type: "POST",
               url: "/admin/allocateroom",  
               data:data , // serializes the form's elements.
     		    dataType: "json",
               success: function(data)
               {
     		        if(data.success)
     		        	{
     		        	$("#listtab tbody").html("<h2>Loading.........</h2>");
     		        	var strhtml=""
     		        	data=data.data;
     		        	  for(var i=0;i<data.length;i++)
     		        		  {
     		        		     strhtml+="<tr>";
     		        		     strhtml+="<td>"+data[i].roomno+"</td>"; 
     		        		     strhtml+="<td>"+data[i].block+"</td>"; 
     		        		     strhtml+="<td>"+data[i].floor+"</td>"; 
     		        		     strhtml+="<td>"+data[i].maxpersons+"</td>";   
     		        		     strhtml+="<td>"+data[i].persons+"</td>";   
     		        		      strhtml+="<td><a href='/admin/roomallocation/"+data[i].id+"' class='btn  '><i class='fa fa-pencil'></i></a>";
     		        	 	     strhtml+="</tr>";
     		        		  }
     		        	$("#listtab tbody").html(strhtml); 
     		        	dtable=$('#listtab').DataTable();  
     		        	}
     		      }
             });
    }
   
</script>
    
  
  
</body>
</html>
