<!doctype html>

<html lang="en">

<head th:replace="admin/base :: head">
     
</head>

<body>
   <th:room  th:replace="admin/base :: header">
   </th:room>
            <div class="content">
                <div class="container">
                    <div class="row">
                        <div class="col-md-12 page-header"> 
                            <h2 class="page-title">Settings</h2> 
                        </div>
                    </div>
                    <div class="row">
                        <div class="  col-md-10 m-auto   mt-3">
                            <div class="card">
                            <div class="card-body"> 
    
    <form action="/admin/savesettings" method="post" id="modalform"> 
        <div class="form-group row">
            <label for="category-name" class="col-sm-2 col-form-label">Per Meal Rate(INR)</label>
            <div class="col-sm-6">
            <input type="number" step="0.1" name='settings[meal_rate]' th:value="${settings.meal_rate}"   class='form-control'>
            </div> 
        </div>
        <hr/>
                <div class="form-group row">
            <label for="category-name" class="col-sm-2 col-form-label">Meals Per Day</label>
            <div class="col-sm-6">
            <input type="number"  name='settings[meal_perday]' th:value="${settings.meal_perday}"   class='form-control'>
            </div> 
        </div>
        <hr/>
         <div class="form-group row">
            <label for="category-name" class="col-sm-2 col-form-label">Other Charges</label>
            <div class="col-sm-6">
            <input type="number"  name='settings[other_charges]' th:value="${settings.other_charges}"   class='form-control'>
            </div> 
        </div>
        <hr/>
             <div class="alert alert-danger" style="display:none"></div>
        <div class="alert alert-success"  style="display:none"></div>
        <div class="sub">
            <span><input type="submit" name='submit' value='Update' class='btn btn-primary btn-sm my-btn'></span> 
        </div>
</form>
</div>
</div>
</div>
</div>
</div>
</div>

<div   th:replace="admin/base :: footer">  
</div> 
<script>
    $(document).ready(function () {  
     
     
      
      $("#modalform").off( "submit");
	   $("#modalform").submit(function(e) {

	      e.preventDefault(); // avoid to execute the actual submit of the form.

  	      $("#modalform .alert").hide();
	      var form = $(this);
	      var url = form.attr('action'); 
	      var data=form.serialize(); 
	      $.ajax({
	             type: "POST",
	             url: $(this).attr("action"),  
	             data:data , // serializes the form's elements.
	   		    dataType: "json",
	             success: function(data)
	             {
	            	 if(data.success)
 	                  { $("#modalform .alert.alert-success").html(data.message).show(); } // show response from the php script.
 	   			  else
 	   				  {
 	   			     $("#modalform .alert.alert-danger").html(data.message).show(); // show response from the php script.  
 	   				  }
	   		      }
	           });
	   		     });  
    });  
	   </script>

</body>

</html>
