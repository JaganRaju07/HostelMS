<!doctype html>

<html lang="en">

<head th:replace="admin/base :: head">
     
</head>

<body>
   <th:block  th:replace="admin/base :: header">
   </th:block>
   
                  <div class="content">
                <div class="container">
                     
                    <div class="row">
                        <div class="  col-md-6 m-auto mt-3">
                        <div class="col-md-12 page-header"> 
                            <h2 class="page-title">My Profile</h2>
                        </div>
                            <div class="card">
                                <div class="content">
  <div class="alert alert-info" role="alert"  th:if="${success}" th:text="${success}">  
  </div>
  <div class="alert alert-danger" role="alert"  th:if="${error}" th:text="${error}">  
</div>  
                            <form name="signup" id="peditfrm" method="post" action="/admin/updateprofile" >

<div class="form-group">
<label>User ID : </label>
#<th:block th:text="${id}"></th:block>
</div>

<div class="form-group">
<label>Reg Date : </label>
<th:block th:text="${regdate}"></th:block>
</div>
<th:block th:if="${updationtime}">
<div class="form-group">
<label>Last Updation Time : </label>
<th:block th:text="${updationtime}"></th:block>
</div>
</th:block>

 


<div class="form-group">
<label>  Full Name</label>
<input class="form-control" type="text" name="fullname" th:value="${fullname}" autocomplete="off" required />
</div>
 

<div class="form-group">
<label>Mobile Number :</label>
<input class="form-control" type="text" name="mobileno" maxlength="10" th:value="${mobileno}" autocomplete="off" required />
</div>
                                        
<div class="form-group">
<label>  Email</label>
<input class="form-control" type="email" name="username" id="username" th:value="${username}"  autocomplete="off" required readonly />
</div> 
                              
<button type="submit" name="update" class="btn btn-primary" id="submit">Update Now </button>

                                    </form>
                            </div>
                        </div>
                            </div>
        </div> 
        </div>
        </div>
        
     <!-- CONTENT-WRAPPER SECTION END-->
   <th:block   th:replace="admin/base :: footer">
 
   </th:block> 
   
</body>
</html>
