<!doctype html>
<html lang="en">
<head th:replace="admin/base :: head">
     
</head>
<body>
<th:block th:replace="admin/base :: header">
</th:block>
   <div class="content">
                <div class="container">
                     
                    <div class="row">
                        <div class="  col-md-6 m-auto mt-3">
                        <div class="col-md-12 page-header"> 
                            <h2 class="page-title">Change Password</h2>
                        </div>
                            <div class="card">
                                <div class="content">
<form role="form" method="post" onSubmit="return valid();" name="chngpwd" action="/admin/updatepassword" >

<div class="form-group">
<label>Current Password</label>
<input class="form-control" type="password" name="password" autocomplete="off" required  />
</div>

<div class="form-group">
<label>Enter Password</label>
<input class="form-control" type="password" name="newpassword" autocomplete="off" required  />
</div>

<div class="form-group">
<label>Confirm Password </label>
<input class="form-control"  type="password" name="confirmpassword" autocomplete="off" required  />
</div>

 <button type="submit" name="change" class="btn btn-primary btn-lg float-end">Change </button> 
</form>
  
 </div>
 <div class="container">
<div class="alert alert-danger" role="alert" th:if="${updatepassword_errors}" th:text="${updatepassword_errors}"> 
</div> 
 
 
<div class="alert alert-success" role="alert"  th:if="${updatepassword_success}" th:text="${updatepassword_success}">  
</div>
 </div>
</div> 
<!---LOGIN PABNEL END-->            
             
  
     <!-- CONTENT-WRAPPER SECTION END-->
	   <th:block   th:replace="admin/base :: footer">
 
   </th:block>
</body>
</html>
