<!doctype html>

<html lang="en">

<head th:replace="student/base :: head">
     
</head>

<body>
   <th:room  th:replace="student/base :: header">
   </th:room>
            <div class="content">
                <div class="container">
                    <div class="row">
                        <div class="col-md-12 page-header"> 
                            <h2 class="page-title">Room Allocation</h2> 
                        </div>
                    </div>
                    <div class="row">
                        <div class="  col-md-10 m-auto   mt-3">
                            <div class="card">
                            <div class="card-body"> 
   
                  
                  <table id="allocationtab" class="table table-striped table-hover table-bordered " cellspacing="0" width="100%" style="background: white;padding: 0 5px;">

    <thead>
        <tr> 
            <th>Room</th>
            <th>Block</th>
            <th>Floor</th>
            <th>From Date</th> 
            <th>To Date</th> 
            <th>Monthly Rent</th>  
          </tr>
    </thead>
    
    <tbody>
       <tr th:each="f:${rooms}">
        <td th:text="${f.room}"></td>
        <td th:text="${f.block}"></td>
        <td th:text="${f.floor}"></td> 
        <td th:text="${f.fromdate}"></td> 
        <td th:text="${f.todate}"></td> 
        <td class="amount" th:text="${f.rent}"></td>
      </tr>
       <tr th:if="${rooms.size()==0}">
        <td colspan=6>No Records Found</td>
        </tr>
      
    </tbody>
    </table>
    </div>
                   
                             </div>
 
            </div>
        </div> 
</div>
</div>

 

<th:block  th:replace="student/base :: footer">
</th:block>
   
</body>
</html>
