<!doctype html>

<html lang="en">

<head th:replace="student/base :: head">
     
</head>

<body>
   <th:block  th:replace="student/base :: header">
   </th:block>
   
                  <div class="content">
                <div class="container">
                     
                    <div class="row">
                        <div class="  col-md-6 m-auto mt-3">
                        <div class="col-md-12 page-header"> 
                            <h2 class="page-title">My Profile</h2>
                        </div>
                            <div class="card">
                                <div class="content">
  <div class="alert alert-info" role="alert"  th:if="${success}" th:text="${success}">  
  </div>
  <div class="alert alert-danger" role="alert"  th:if="${error}" th:text="${error}">  
</div>  
                            <form name="signup" id="peditfrm" method="post" action="/student/updateprofile" >

<div class="form-group">
<label>User ID : </label>
#<th:block th:text="${user.id}"></th:block>
</div>

 
<th:block th:if="${user.updationdate}">
<div class="form-group">
<label>Last Updation Time : </label>
<th:block th:text="${user.updationdate}"></th:block>
</div>
</th:block>

 


<div class="form-group">
<label>  Full Name</label>
<input class="form-control" type="text" name="fullname" th:value="${user.fullname}" autocomplete="off" required />
</div>
 

<div class="form-group">
<label>Mobile Number :</label>
<input class="form-control" type="text" name="mobileno" maxlength="10" th:value="${user.mobilenumber}" autocomplete="off" required />
</div>
                                        
<div class="form-group">
<label>  Email</label>
<input class="form-control" type="email" name="username" id="username" th:value="${user.username}"  autocomplete="off" required readonly />
</div> 
                              
<button type="submit" name="update" class="btn btn-primary" id="submit">Update Now </button>

                                    </form>
                            </div>
                        </div>
                            </div>
        </div> 
        </div>
        </div>
        
     <!-- CONTENT-WRAPPER SECTION END-->
   <th:block   th:replace="student/base :: footer">
 
   </th:block> 
    <script>
 
  (function ($) {  
		
	  $('input[name=fullname]').on('keypress',function(event){
			 return validatealpha(event);		 
		 });  


$('input[name=mobileno]').on('keypress',function(event){
		 return validatemobile(event);		 
	 });		
	
 
})(jQuery); 
  
  function loadcourses(dept)
  {  
		 data={department:dept} ; 
 $.ajax({
        type: "POST",
        url: "/loadcourses",  
        data:data , // serializes the form's elements.
		    dataType: "json",
        success: function(data)
        {
		        if(data.success)
		        	{
		        	 
		        	var strhtml=""
		        	data=data.data;
		        	  for(var i=0;i<data.length;i++)
		        		  { 
		        		     strhtml+="<option value='"+data[i].id+"'>"+data[i].name+"</option>";  
		        		  }
		        	$("select[name=course]").html(strhtml); 
		        	 
		        	}
		      }
      });
  }
  </script>
</body>
</html>
